name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

jobs:
  test:
    name: Test Suite
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Run full test suite
        run: |
          set -o pipefail

          # Dynamically pick the latest available iPhone simulator (non-Pro/Plus/Max/SE)
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
import json, sys
devices = json.load(sys.stdin)['devices']
for runtime in sorted(devices, reverse=True):
    if 'iOS' not in runtime:
        continue
    for d in devices[runtime]:
        name = d.get('name', '')
        if d.get('isAvailable') and 'iPhone' in name \
                and 'Pro' not in name and 'Plus' not in name \
                and 'Max' not in name and 'SE' not in name \
                and 'Air' not in name:
            print(d['udid'])
            raise SystemExit
")
          echo "Selected simulator: $SIM_ID"

          xcodebuild test \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination "id=$SIM_ID" \
            -resultBundlePath result.xcresult \
            2>&1 | tee xcode.log
          grep -E "TEST SUCCEEDED|TEST FAILED" xcode.log

      - name: Check coverage
        run: |
          xcrun xccov view --report --json result.xcresult > coverage.json

          python3 - <<'EOF'
import json, sys

with open("coverage.json") as f:
    report = json.load(f)

# Collect all source files from the app target (exclude test targets)
source_files = []
for target in report.get("targets", []):
    if "Tests" in target.get("name", ""):
        continue
    for file in target.get("files", []):
        path = file.get("path", "")
        # Skip test files and generated files that land in the app target
        if "Tests" in path or path.endswith("main.swift"):
            continue
        source_files.append({
            "name": file.get("name", path),
            "path": path,
            "coverage": file.get("lineCoverage", 0.0),
        })

if not source_files:
    print("No source files found in coverage report.")
    sys.exit(0)

FAIL_THRESHOLD = 0.60
WARN_THRESHOLD = 0.80

failing = [f for f in source_files if f["coverage"] < FAIL_THRESHOLD]
warning = [f for f in source_files if FAIL_THRESHOLD <= f["coverage"] < WARN_THRESHOLD]

print(f"\n=== Coverage Report ({len(source_files)} source files) ===\n")

for f in sorted(source_files, key=lambda x: x["coverage"]):
    pct = f["coverage"] * 100
    flag = "FAIL" if f["coverage"] < FAIL_THRESHOLD else ("WARN" if f["coverage"] < WARN_THRESHOLD else "  OK")
    print(f"  [{flag}] {f['name']:50s} {pct:5.1f}%")

print()

if warning:
    print(f"WARNING: {len(warning)} file(s) below 80% coverage:")
    for f in warning:
        print(f"  {f['name']} — {f['coverage']*100:.1f}%")
    print()

if failing:
    print(f"FAIL: {len(failing)} file(s) below 60% coverage threshold:")
    for f in failing:
        print(f"  {f['name']} — {f['coverage']*100:.1f}%")
    sys.exit(1)

print(f"Coverage check passed. ({len(warning)} warning(s), 0 failures)")
EOF
