name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
    paths:
      - 'FinanceTracker/**'
      - 'FinanceTrackerTests/**'
      - 'FinanceTrackerUITests/**'
      - 'scripts/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.4'

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('FinanceTracker/**/*.swift', 'FinanceTrackerTests/**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 scripts/select_simulator.py)
          echo "Selected simulator: $SIM_ID"
          # No push/StoreKit/universal-link/Spotlight-dependent tests currently exist —
          # add --requires <feature,feature> here if that changes (see scripts/slim_simulator.sh header)
          bash scripts/slim_simulator.sh "$SIM_ID" || true
          xcodebuild test \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination "id=$SIM_ID" \
            -skip-testing:FinanceTrackerUITests \
            -resultBundlePath result.xcresult \
            2>&1 | tee xcode.log
          grep -E "TEST SUCCEEDED|TEST FAILED" xcode.log

      - name: Check coverage
        run: |
          xcrun xccov view --report --json result.xcresult > coverage.json
          python3 scripts/check_coverage.py coverage.json
