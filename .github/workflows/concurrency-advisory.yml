name: Concurrency Advisory

# Advisory only (continue-on-error): SWIFT_VERSION is 5.0 in every target, so
# Sendable/isolation diagnostics are warnings and nothing else runs TSan.
# Overrides are command-line only; project.pbxproj is untouched.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
    paths:
      - 'FinanceTracker/**'
      - 'FinanceTrackerTests/**'
      - 'scripts/**'
      - '.github/**'

concurrency:
  group: concurrency-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  concurrency-advisory:
    name: Concurrency Advisory (non-blocking)
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.4'

      - name: Unit tests under ThreadSanitizer
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 scripts/select_simulator.py)
          echo "Selected simulator: $SIM_ID"
          bash scripts/slim_simulator.sh "$SIM_ID" || true
          xcodebuild test \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination "id=$SIM_ID" \
            -skip-testing:FinanceTrackerUITests \
            -enableThreadSanitizer YES \
            2>&1 | tee tsan.log

      - name: Build with strict concurrency
        if: always()
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 scripts/select_simulator.py)
          xcodebuild build \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination "id=$SIM_ID" \
            SWIFT_STRICT_CONCURRENCY=complete \
            2>&1 | tee strict.log
          # Anchor on file:line:col so wrapped/duplicate diagnostic renderings count once.
          total=$(grep -E '^/.*:[0-9]+:[0-9]+: warning:' strict.log | sort -u | wc -l | tr -d ' ')
          conc=$(grep -E '^/.*:[0-9]+:[0-9]+: warning:' strict.log | grep -iE "sendable|isolat|actor|concurren|data race" | sort -u | wc -l | tr -d ' ')
          echo "Strict-concurrency build: $total unique warnings ($conc concurrency-related)"
          echo "Strict-concurrency build: $total unique warnings ($conc concurrency-related)" >> "$GITHUB_STEP_SUMMARY"
