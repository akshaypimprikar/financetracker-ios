name: Xcode 27 Advisory

# Advisory only (continue-on-error): every other workflow pins macos-26 + Xcode 26.4, so the
# `#if compiler(>=6.4)` branches (TransactionImportWriting, CategorySuggesting; PR #112) only
# ever compile on a developer's local Xcode 27. This job builds and unit-tests on GitHub's
# `xcode-27` image (preview; per the runner-images xcode-27-arm64 README) so a Swift 6.4 break
# shows up on the PR. It is not a required check.
#
# Pinned to 27.1, not the image's 27.0 default: Xcode 27.0 (27A266a) carries the
# `nonisolated` on those two protocols over onto the actor test fakes that conform to them
# ("'nonisolated' modifier cannot be applied to this declaration" at TestHelpers.swift) and
# fails the test target, while 27.1 (27A9275) and 27.2 compile the same source cleanly.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
    paths:
      - 'FinanceTracker/**'
      - 'FinanceTracker.xcodeproj/**'
      - 'FinanceTrackerTests/**'
      - 'scripts/**'
      - '.github/**'

concurrency:
  group: xcode27-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  xcode27-advisory:
    name: Xcode 27 Advisory (non-blocking)
    runs-on: xcode-27
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '~27.1'

      - name: Install CocoaPods dependencies
        if: hashFiles('Podfile') != ''
        run: pod install

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Unit tests on Xcode 27
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 scripts/select_simulator.py)
          echo "Selected simulator: $SIM_ID"
          bash scripts/slim_simulator.sh "$SIM_ID" || true
          xcodebuild test \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination "id=$SIM_ID" \
            -skip-testing:FinanceTrackerUITests \
            2>&1 | tee xcode27.log
          grep -E "TEST SUCCEEDED|TEST FAILED" xcode27.log
